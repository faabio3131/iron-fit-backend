name: Temporary P3 security dependency lockfile refresh
on:
  push:
    branches:
      - fix/p3-expired-trial-recovery-20261117
permissions:
  contents: write
jobs:
  refresh:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(lock): regenerate security dependency tree') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Regenerate consistent lockfile without install scripts
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit lock only
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore(lock): regenerate security dependency tree"
            git push origin HEAD:fix/p3-expired-trial-recovery-20261117
          fi
