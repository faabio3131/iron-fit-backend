name: Security lock refresh

on:
  push:
    branches:
      - chore/iron-delta-agents
    paths:
      - package.json
      - .github/workflows/security-lock-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/iron-delta-agents
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Refresh package lock only
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit refreshed lock if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix(security): refresh lockfile after controlled updates"
          git push origin HEAD:chore/iron-delta-agents
