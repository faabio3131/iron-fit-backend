name: IRON S0 Quality Gate

on:
  push:
    branches:
      - main
      - 'stabilization/**'
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: iron-s0-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build, lint, audit and smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/iron_ci?schema=public

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: iron_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d iron_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Fresh-install all database migrations
        run: |
          npx prisma migrate deploy
          npx prisma migrate status

      - name: Lint and typecheck
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Smoke regression tests
        run: npm run test:smoke

      - name: Build production container image
        run: docker build --pull -t iron-fit-backend-ci:${{ github.sha }} .

      - name: Start production container and verify liveness/readiness
        run: |
          CID="$(docker run -d --network host \
            -e NODE_ENV=production \
            -e PORT=3333 \
            -e DATABASE_URL="$DATABASE_URL" \
            -e JWT_SECRET=ci-runtime-jwt-secret-0123456789abcdef0123456789abcdef \
            -e CORS_ORIGINS=http://localhost:3000 \
            -e TRUST_PROXY_HOPS=1 \
            -e AUTH_REQUIRE_VERIFIED_EMAIL=false \
            -e MFA_ENCRYPTION_KEY=0123456789abcdef0123456789abcdef \
            -e AUTH_ACTION_TOKEN_ENCRYPTION_KEY=abcdef0123456789abcdef0123456789 \
            -e IRON_FIT_TRIAL_PLAN_CODE=TRIAL \
            -e IRON_FIT_TRIAL_DAYS=14 \
            iron-fit-backend-ci:${{ github.sha }})"
          trap 'docker logs "$CID" || true; docker rm -f "$CID" >/dev/null 2>&1 || true' EXIT
          READY=0
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3333/api/v1/health/ready >/tmp/iron-ready.json; then
              READY=1
              break
            fi
            sleep 1
          done
          test "$READY" = "1"
          curl -fsS http://127.0.0.1:3333/api/v1/health/live
          cat /tmp/iron-ready.json
