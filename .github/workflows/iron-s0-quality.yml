name: IRON S0 Quality Gate

on:
  push:
    branches:
      - main
      - 'stabilization/**'
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: iron-s0-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build, lint, audit and smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/iron_ci?schema=public

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: iron_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d iron_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Fresh-install all database migrations
        run: |
          npx prisma migrate deploy
          npx prisma migrate status

      - name: Lint and typecheck
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Smoke regression tests
        run: npm run test:smoke

      - name: Block 6 integrated HTTP + PostgreSQL E2E
        run: npm run test:b6:e2e

      - name: Build production container image
        run: docker build --pull -t iron-fit-backend-ci:${{ github.sha }} .

      - name: Start production container and verify readiness
        run: |
          set -euo pipefail
          docker rm -f iron-fit-backend-runtime >/dev/null 2>&1 || true
          docker run -d --name iron-fit-backend-runtime --network host \
            -e NODE_ENV=production \
            -e PORT=3333 \
            -e DATABASE_URL="${DATABASE_URL}" \
            -e CORS_ORIGINS=https://example.invalid \
            -e TRUST_PROXY_HOPS=0 \
            -e JWT_SECRET="$(openssl rand -hex 32)" \
            -e MFA_ENCRYPTION_KEY="$(openssl rand -hex 32)" \
            -e AUTH_ACTION_TOKEN_ENCRYPTION_KEY="$(openssl rand -hex 32)" \
            -e AUTH_REQUIRE_VERIFIED_EMAIL=false \
            iron-fit-backend-ci:${{ github.sha }}

          ready=0
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:3333/api/v1/health/ready >/dev/null; then
              ready=1
              break
            fi
            sleep 0.5
          done

          if [ "${ready}" -ne 1 ]; then
            docker logs iron-fit-backend-runtime
            exit 1
          fi

          curl --fail --silent http://127.0.0.1:3333/api/v1/health/live
          docker logs iron-fit-backend-runtime 2>&1 | grep -q '"event":"service_started"'
          docker rm -f iron-fit-backend-runtime >/dev/null
