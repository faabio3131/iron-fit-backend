name: IRON S0 Quality Gate

on:
  push:
    branches:
      - main
      - 'stabilization/**'
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: iron-s0-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build, lint, audit and smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Regenerate lockfile for security override
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit regenerated lockfile when needed
        env:
          PR_BRANCH: ${{ github.head_ref }}
        run: |
          if git diff --quiet -- package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix(security): refresh lockfile for patched multer"
          git push origin "HEAD:${PR_BRANCH}"

      - name: Install dependencies
        run: npm ci

      - name: Capture dependency audit diagnostics
        run: npm audit --json > npm-audit.json || true

      - name: Upload dependency audit diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-${{ github.sha }}
          path: npm-audit.json
          retention-days: 1

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint and typecheck
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Smoke regression tests
        run: npm run test:smoke
