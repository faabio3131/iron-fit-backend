name: IRON S0 Quality Gate

on:
  push:
    branches:
      - main
      - 'stabilization/**'
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: iron-s0-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build, lint, audit and smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/iron_ci?schema=public

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: iron_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d iron_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Fresh-install all database migrations
        run: |
          npx prisma migrate deploy
          npx prisma migrate status

      - name: Lint and typecheck
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Smoke regression tests
        run: npm run test:smoke

      - name: Build production container image
        run: docker build --pull -t iron-fit-backend-ci:${{ github.sha }} .
