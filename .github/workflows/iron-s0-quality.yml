name: IRON S0 Quality Gate

on:
  push:
    branches:
      - main
      - 'stabilization/**'
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: iron-s0-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build, lint, audit and smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/iron_ci?schema=public
      NODE_ENV: test
      PORT: 3333
      B6_API_URL: http://127.0.0.1:3333/api/v1
      JWT_SECRET: iron-b6-ci-jwt-secret-0123456789-abcdefghijklmnopqrstuvwxyz
      MFA_ENCRYPTION_KEY: 1111111111111111111111111111111111111111111111111111111111111111
      AUTH_ACTION_TOKEN_ENCRYPTION_KEY: 2222222222222222222222222222222222222222222222222222222222222222
      AUTH_REQUIRE_VERIFIED_EMAIL: 'false'
      CORS_ORIGINS: http://localhost:3000
      TRUST_PROXY_HOPS: '0'
      IRON_FIT_TRIAL_PLAN_CODE: IRON_TRIAL
      IRON_FIT_TRIAL_DAYS: '14'
      SAAS_BILLING_PROVIDER: INTERNAL_SANDBOX
      SAAS_BILLING_SANDBOX_ENABLED: 'true'
      SAAS_BILLING_SANDBOX_SECRET: iron-b6-sandbox-secret-0123456789-abcdef
      SAAS_BILLING_INVOICE_DUE_DAYS: '0'
      SAAS_BILLING_DUNNING_GRACE_DAYS: '1'

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: iron_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d iron_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Fresh-install all database migrations
        run: |
          npx prisma migrate deploy
          npx prisma migrate status

      - name: Lint and typecheck
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Smoke regression tests
        run: npm run test:smoke

      - name: Seed integrated system fixture
        run: |
          npx prisma db seed
          node scripts/b6-bootstrap.mjs

      - name: Integrated B6 HTTP system journey
        run: |
          set -euo pipefail
          node dist/src/main.js > /tmp/iron-b6-server.log 2>&1 &
          SERVER_PID=$!
          cleanup() {
            kill "$SERVER_PID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          if ! node scripts/b6-system-e2e.mjs; then
            echo '--- IRON B6 backend log ---'
            cat /tmp/iron-b6-server.log || true
            exit 1
          fi

      - name: Build production container image
        run: docker build --pull -t iron-fit-backend-ci:${{ github.sha }} .
