name: IRON S0 Quality Gate

on:
  push:
    branches:
      - main
      - 'stabilization/**'
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: iron-s0-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build, lint, audit and smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_ENV: test
      IRON_RUNTIME_ENV: HOMOLOG
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/iron_ci?schema=public
      AUTH_REQUIRE_VERIFIED_EMAIL: 'false'
      SAAS_BILLING_PROVIDER: INTERNAL_SANDBOX
      SAAS_BILLING_SANDBOX_ENABLED: 'true'
      TRUST_PROXY_HOPS: '0'
      PORT: '3333'
      B6_API_URL: http://127.0.0.1:3333/api/v1

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: iron_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d iron_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repository secret scan
        run: node scripts/secret-scan.mjs

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate isolated E2E credentials
        shell: bash
        run: |
          set -euo pipefail
          mask_and_export() {
            local key="$1"
            local value="$2"
            echo "::add-mask::$value"
            printf '%s=%s\n' "$key" "$value" >> "$GITHUB_ENV"
          }

          mask_and_export JWT_SECRET "$(openssl rand -hex 32)"
          mask_and_export MFA_ENCRYPTION_KEY "$(openssl rand -hex 32)"
          mask_and_export AUTH_ACTION_TOKEN_ENCRYPTION_KEY "$(openssl rand -hex 32)"
          mask_and_export SAAS_BILLING_SANDBOX_SECRET "$(openssl rand -hex 32)"
          mask_and_export B6_OWNER_PASSWORD "Aa1!$(openssl rand -hex 16)"
          mask_and_export B6_STAFF_PASSWORD "Bb2!$(openssl rand -hex 16)"
          mask_and_export B6_STUDENT_PASSWORD "Cc3!$(openssl rand -hex 16)"
          mask_and_export B6_RESET_PASSWORD "Dd4!$(openssl rand -hex 16)"
          mask_and_export B6_ADMIN_PASSWORD "Ee5!$(openssl rand -hex 16)"

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Fresh-install all database migrations
        run: |
          npx prisma migrate deploy
          npx prisma migrate status

      - name: Lint and typecheck
        run: npm run lint

      - name: Build
        run: npm run build

      - name: C11 seed DB-only secret-reference DR canary
        run: node scripts/c11-dr-seed.mjs

      - name: C11 PostgreSQL backup/restore secret boundary drill
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/iron-c11-dr
          rm -f /tmp/iron-c11-dr/iron_ci.sql

          docker run --rm --network host \
            -e PGPASSWORD=postgres \
            -v /tmp/iron-c11-dr:/dr \
            postgres:18 \
            pg_dump -h 127.0.0.1 -U postgres -d iron_ci \
              --no-owner --no-privileges --format=p --file=/dr/iron_ci.sql

          for forbidden in '"apiKeyEnc"' '"accessTokenEnc"' '"refreshTokenEnc"' '"webhookSecretEnc"'; do
            if grep -Fq "$forbidden" /tmp/iron-c11-dr/iron_ci.sql; then
              echo "C11_DR_FAIL legacy provider credential column found in DB backup"
              exit 1
            fi
          done

          if grep -Fq 'C11_REUSABLE_SECRET_MUST_NEVER_BE_IN_DATABASE' /tmp/iron-c11-dr/iron_ci.sql; then
            echo "C11_DR_FAIL reusable secret canary found in DB backup"
            exit 1
          fi

          docker run --rm --network host \
            -e PGPASSWORD=postgres \
            postgres:18 \
            psql -h 127.0.0.1 -U postgres -d postgres \
              -v ON_ERROR_STOP=1 \
              -c 'DROP DATABASE IF EXISTS iron_c11_restore;' \
              -c 'CREATE DATABASE iron_c11_restore;'

          docker run --rm --network host \
            -e PGPASSWORD=postgres \
            -v /tmp/iron-c11-dr:/dr \
            postgres:18 \
            psql -h 127.0.0.1 -U postgres -d iron_c11_restore \
              -v ON_ERROR_STOP=1 -f /dr/iron_ci.sql >/tmp/iron-c11-restore.log

          DATABASE_URL='postgresql://postgres:postgres@localhost:5432/iron_c11_restore?schema=public' \
            node scripts/c11-dr-restore-verify.mjs

      - name: Smoke regression tests
        run: npm run test:smoke

      - name: Seed deterministic Block 6 prerequisites
        run: node scripts/b6-e2e-seed.mjs

      - name: Materialize and validate canonical IRON V1 launch draft
        env:
          IRON_LAUNCH_ACTOR_EMAIL: b6-admin@example.com
        run: npm run commercial:materialize-v1

      - name: Start live backend for integrated E2E
        run: |
          node dist/src/main.js > /tmp/iron-b6-backend.log 2>&1 &
          echo $! > /tmp/iron-b6-backend.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3333/api/v1/health/ready >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/iron-b6-backend.log
          exit 1

      - name: Integrated live E2E
        run: node --test --test-concurrency=1 test/b6.*.e2e.mjs

      - name: Checkout certified IRON app surface
        uses: actions/checkout@v4
        with:
          repository: faabio3131/iron-fit-app
          ref: 7c6290eb888521f60e04e050f7b0e579c6f41029
          path: iron-fit-app

      - name: Install certified IRON app dependencies
        working-directory: iron-fit-app
        run: npm ci

      - name: Cross-surface live app client against backend
        working-directory: iron-fit-app
        env:
          IRON_LIVE_E2E: 'true'
          EXPO_PUBLIC_API_URL: http://127.0.0.1:3333/api/v1
        run: npx jest test/live-system-contract.test.ts --runInBand --ci

      - name: Stop live backend
        if: always()
        run: |
          if test -f /tmp/iron-b6-backend.pid; then
            kill "$(cat /tmp/iron-b6-backend.pid)" 2>/dev/null || true
          fi
          tail -n 200 /tmp/iron-b6-backend.log 2>/dev/null || true

      - name: Build production container image
        run: docker build --pull -t iron-fit-backend-ci:${{ github.sha }} .
