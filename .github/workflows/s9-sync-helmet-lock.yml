name: S9 Sync Helmet Lock

on:
  push:
    branches:
      - stabilization/iron-s9-api-hardening
    paths:
      - .github/workflows/s9-sync-helmet-lock.yml

permissions:
  contents: write

jobs:
  sync-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: stabilization/iron-s9-api-hardening
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Sync package lock
        run: npm install --package-lock-only
      - name: Verify clean install and audit
        run: |
          npm ci
          npm audit --audit-level=high
      - name: Commit lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(s9): sync lock after Helmet pin"
          git push origin HEAD:stabilization/iron-s9-api-hardening
