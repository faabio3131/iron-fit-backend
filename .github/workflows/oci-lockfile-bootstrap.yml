name: OCI dependency lockfile bootstrap

on:
  push:
    branches:
      - commercial/oci-vault-c4a

permissions:
  contents: write

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: commercial/oci-vault-c4a
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Generate exact OCI dependency lockfile
        run: npm install --save-exact --package-lock-only oci-common@2.142.0 oci-secrets@2.142.0 oci-vault@2.142.0
      - name: Commit lockfile and remove bootstrap workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git rm .github/workflows/oci-lockfile-bootstrap.yml
          git commit -m "build(oci): pin official OCI SDK dependencies"
          git push origin HEAD:commercial/oci-vault-c4a
