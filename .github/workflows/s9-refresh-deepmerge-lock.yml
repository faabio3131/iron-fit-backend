name: S9 Refresh Deepmerge Lock

on:
  push:
    branches:
      - stabilization/iron-s9-api-hardening
    paths:
      - .github/workflows/s9-refresh-deepmerge-lock.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: stabilization/iron-s9-api-hardening
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Refresh lockfile with security override
        run: npm install --package-lock-only
      - name: Verify patched dependency and audit
        run: |
          npm ci
          npm ls deepmerge-ts
          npm audit --audit-level=high
      - name: Commit lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(s9): refresh lock for deepmerge security override"
          git push origin HEAD:stabilization/iron-s9-api-hardening
